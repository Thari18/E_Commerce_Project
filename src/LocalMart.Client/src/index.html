<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>LocalMart — Multi-Vendor E-Commerce Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'lm-bg': 'var(--lm-bg)',
            'lm-surface': 'var(--lm-surface)',
            'lm-surface-elevated': 'var(--lm-surface-elevated)',
            'lm-border': 'var(--lm-border)',
            'lm-border-hover': 'var(--lm-border-hover)',
            'lm-primary': 'var(--lm-primary)',
            'lm-primary-hover': 'var(--lm-primary-hover)',
            'lm-text-main': 'var(--lm-text-main)',
            'lm-text-muted': 'var(--lm-text-muted)',
            'lm-success': 'var(--lm-success)',
            'lm-warning': 'var(--lm-warning)',
            'lm-danger': 'var(--lm-danger)',
          },
          boxShadow: {
            'lm-glow': 'var(--lm-glow)',
          },
          borderRadius: {
            'lm-sm': 'var(--lm-radius-sm)',
            'lm-md': 'var(--lm-radius-md)',
            'lm-lg': 'var(--lm-radius-lg)',
            'lm-xl': 'var(--lm-radius-xl)',
            'lm-2xl': 'var(--lm-radius-2xl)',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="bg-[var(--lm-bg)] text-[var(--lm-text-main)] antialiased selection:bg-blue-600 selection:text-white">
  <app-root></app-root>
</body>
</html>
